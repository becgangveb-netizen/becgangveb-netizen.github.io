name: daily-telemetry-refresh
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh timestamps
        run: python scripts/refresh.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git diff --staged --quiet || git commit -m 'chore: daily telemetry refresh'
          git push
